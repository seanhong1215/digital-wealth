# ==============================================================================
# docker-compose.yml — 本專案的服務編排定義
#
# 這個檔案是什麼：
#   描述本專案需要哪些「服務」（service），每個服務用什麼映像、開什麼 port、
#   資料存在哪裡。執行 `docker compose up` 時，Docker 會照這個檔案把所有
#   容器建立並啟動起來。
#
# 為什麼存在：
#   本專案不做雲端部署（見 docs/adr/0004），任何人只要有 Docker，
#   跑一行 `docker compose up` 就能得到一模一樣的環境 —— 不會有「在我電腦上
#   跑得起來」的問題。
#
# 目前階段（單元 0.6）：
#   postgres、redis 兩個基礎設施 ＋ api（NestJS）。
#   之後會再加入 web（React，單元 1.2）與 market-feed（報價產生器，單元 2.1），
#   最終是 docs/00-architecture.md 裡的 5 服務拓撲。
#
# 注意：新版 Docker Compose 已不需要頂層的 `version:` 欄位，寫了反而會警告。
# ==============================================================================

# ── 專案名稱 ★ ────────────────────────────────────────────────────────────────
#
#   不寫的話，Compose 會拿**目錄名**當專案名 —— 這台機器上目錄叫 FinTech，
#   於是容器網路變成 fintech_default、資料卷變成 fintech_postgres_data。
#
#   問題是目錄名不在版控裡。別人 clone 到不同名字的資料夾，就會得到
#   不同的網路與資料卷名稱 —— 兩個人的環境長得不一樣，而且
#   `docker volume ls` 看到的東西對不上文件。
#
#   明確寫出來之後，專案名與目錄無關，任何人 clone 到任何路徑
#   都會得到 digital-wealth_postgres_data。
name: digital-wealth

services:
  # ============================================================================
  # postgres — 權威資料儲存
  #
  # 存放帳戶、持倉、委託、成交、交易明細等所有「必須正確」的資料。
  # 選 PostgreSQL 的原因是下單需要 ACID 交易與行鎖（SELECT ... FOR UPDATE），
  # 詳見 docs/02-backend.md 的「交易一致性設計」。
  # ============================================================================
  postgres:
    # 映像版本說明：
    #   - `16` 是 PostgreSQL 主版本，`alpine` 是精簡版 Linux 基底（體積小很多）
    #   - 開發期用 `16-alpine`，會自動取得 16.x 的最新修補版
    #   - 【封版時要改】改成完整版本號（例如 `16.10-alpine`）把版本 pin 死，
    #     避免半年後重新 build 時基底變了導致行為不同。見 PROJECT.md §11
    image: postgres:16-alpine

    # 容器名稱。不設的話 Docker 會自動產生像 digital-wealth-postgres-1 這種名字，
    # 明確命名之後 `docker logs digital-wealth-postgres` 這類指令比較好打。
    container_name: digital-wealth-postgres

    # 重啟策略：
    #   unless-stopped = 容器異常結束時自動重啟，但如果是你手動 stop 的就不重啟。
    #   這樣電腦重開機後容器會自己回來，但你刻意停掉的不會被吵醒。
    restart: unless-stopped

    # 環境變數 —— postgres 映像會讀這三個變數來初始化資料庫。
    # 值來自同目錄的 .env 檔（Compose 會自動載入）。
    # 寫成 ${VAR} 而不是直接寫死，是為了讓密碼不進版控。
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 讓容器內的時間顯示為台北時間，方便你用 psql 看資料時對照。
      # 注意：這不影響資料庫實際儲存的時間 —— 我們所有時間欄位都用
      # TIMESTAMPTZ（含時區），儲存時一律轉為 UTC，顯示時才轉當地時間。
      TZ: Asia/Taipei

    # Port 映射，格式是「主機端:容器內」。
    #   - 左邊 5432 是你在 WSL 裡用 psql 連線要打的 port
    #   - 右邊 5432 是容器內部 postgres 監聽的 port（固定不變）
    #   - ${POSTGRES_PORT:-5432} 的意思是「用 .env 的 POSTGRES_PORT，
    #     沒設定就用預設值 5432」
    #
    # 其他服務（例如之後的 api）要連資料庫時，不走這個 port，
    # 而是直接用服務名 `postgres:5432` —— 因為它們在同一個 Docker 網路裡。
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    # Volume（資料卷）—— 容器的檔案系統是「用完即丟」的，
    # 容器一刪，裡面的資料就沒了。
    # 把 postgres 存資料的目錄掛到一個具名 volume，資料就會留在主機上，
    # 即使 `docker compose down` 把容器刪掉，下次啟動資料還在。
    #
    # 【要清空資料重來時】用 `docker compose down -v`，那個 -v 會連 volume 一起刪。
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck（健康檢查）★ 這段是新手最常漏掉、也最常踩坑的地方
    #
    # 問題是什麼：
    #   容器「啟動了」不等於裡面的服務「可以用了」。PostgreSQL 容器起來後，
    #   還要花幾秒初始化資料庫才能接受連線。
    #   如果 api 服務在這幾秒內就去連，會直接連線失敗然後掛掉。
    #
    # 只用 depends_on 為什麼不夠：
    #   depends_on 只保證「容器啟動順序」，不保證「服務已就緒」。
    #   Docker 看到 postgres 容器 started 就會去啟動 api，但那時 postgres
    #   可能還在初始化。
    #
    # healthcheck 怎麼解決：
    #   定期執行一個指令來判斷服務是否真的可用。搭配 api 那邊寫
    #   `depends_on: postgres: condition: service_healthy`，
    #   Docker 就會等到這個檢查通過才啟動 api。
    healthcheck:
      # pg_isready 是 postgres 內建的就緒檢查工具，回傳 0 表示可以接受連線。
      # 用 CMD-SHELL 而不是 CMD，是因為指令裡有 ${} 變數需要 shell 展開。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s      # 每 5 秒檢查一次
      timeout: 5s       # 單次檢查超過 5 秒視為失敗
      retries: 10       # 連續失敗 10 次才標記為 unhealthy
      start_period: 10s # 前 10 秒的失敗不計入 retries（給初始化緩衝時間）

  # ============================================================================
  # redis — 快取與訊息匯流排
  #
  # 本專案只賦予它兩個明確職責（見 docs/adr/0003）：
  #   1. 報價 pub/sub 扇出 —— market-feed 發布報價，api 訂閱後推給 WebSocket
  #   2. 下單冪等鍵 —— SET NX EX 300，擋掉使用者連點兩次造成的重複委託
  #
  # 沒有這兩個理由的話，以本專案的資料量根本不需要 Redis，
  # 硬加就變成為了技術而技術，徒增維運成本。
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: digital-wealth-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei

    # --appendonly yes 開啟 AOF（Append Only File）持久化。
    #
    # 為什麼要開：
    #   Redis 預設把資料放在記憶體，重啟就全沒了。
    #   我們的冪等鍵如果因為 Redis 重啟而消失，重複下單的防線就破了一層。
    #
    # 那為什麼還需要資料庫的 UNIQUE 約束？
    #   AOF 也不是 100% 不丟資料（預設每秒同步一次，最多可能丟 1 秒的寫入）。
    #   所以冪等是「雙層防護」：Redis 是快速路徑，資料庫 UNIQUE 是最終保證。
    #   詳見 docs/02-backend.md 的 orders 表說明。
    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      # redis-cli ping 正常會回 PONG
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================================
  # api — NestJS 後端（單元 0.6）
  #
  # 帳務與交易核心。啟動時會自動套用 migration 與寫入種子資料，
  # 所以 `docker compose up` 之後直接就有一個裝滿假資料的可用系統
  # ——這是 PROJECT.md P0 的完成判準：「一行啟動，無任何手動步驟」。
  #
  # 啟動流程寫在 api/docker-entrypoint.sh。
  # ============================================================================
  api:
    # 這裡用 build 而不是 image，因為這是我們自己的程式碼。
    #
    # context 是**專案根目錄**（`.`）而不是 `./api` —— 因為 npm workspaces
    # 的相依定義在根目錄，而且 api 依賴 shared 的原始碼。
    # dockerfile 則指向 api 目錄下的那份。
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: digital-wealth-api
    restart: unless-stopped

    environment:
      NODE_ENV: development
      TZ: Asia/Taipei

      # ★ 主機名稱用「服務名」而不是 localhost。
      #
      # 這是新手最常卡住的地方：在容器內，localhost 指的是**這個容器自己**，
      # 不是你的電腦。要連別的容器，得用 Compose 的服務名 ——
      # Docker 內建的 DNS 會把 `postgres` 解析成該容器的 IP。
      #
      # 對照：你在 WSL 裡跑 `npm run start:dev -w @digital-wealth/api` 時，
      # 用的是 .env 裡的預設值 localhost，走的是上面 ports 映射出來的通道。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      API_PORT: 3000

      # ★ JWT 密鑰。**必須**從 .env 傳進來 —— 沒有預設值是刻意的
      #   （見 api/src/config/env.ts：沒設定就啟動失敗，而不是
      #   靜默地用一把大家都知道的密鑰在跑）。
      #
      #   ⚠️ 這一行漏掉過。api 容器一直沒被真正啟動過，所以直到
      #      把整套 compose 跑起來的那一刻才發現：容器裡沒有 .env
      #      （`--env-file-if-exists` 會安靜地略過），環境變數又沒傳，
      #      於是 migration 一啟動就因為缺 JWT_SECRET 而失敗。
      #
      #      教訓是「設定檔寫好」不等於「設定正確」—— 唯一能證明的
      #      方式是真的跑一次。
      JWT_SECRET: ${JWT_SECRET:?請在 .env 設定 JWT_SECRET（產生方式：openssl rand -base64 32）}

    ports:
      # 容器內固定 3000，主機端可由 .env 的 API_PORT 調整
      # （3000 被其他程式佔用時很有用）。
      - "${API_PORT:-3000}:3000"

    # ★ 等待相依服務「真的可用」才啟動，而不只是「容器已建立」。
    #
    # condition: service_healthy 會等到上面定義的 healthcheck 通過。
    # 沒有這個條件的話，api 會在 postgres 還在初始化時就去連線，
    # 然後因為 DatabaseService 的快速失敗設計而直接退出。
    #
    # ⚠️ 注意 redis 用的是同樣的條件，但 api 的程式其實**允許 Redis 連不上**
    #    （RedisService 只記警告不中斷）。這裡仍然等它，是因為正常啟動時
    #    多等兩秒沒有代價，而讓服務在完整狀態下啟動比較好推理。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # 健康檢查打的是 api 自己的 /health 端點。
    #
    # 為什麼用 node 而不是 curl：slim 映像沒有裝 curl，
    # 為了健康檢查多裝一個工具不划算。node 本來就在裡面。
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # migration 與 seed 要跑一段時間（heavy-history 情境有 8000 筆），
      # 給足緩衝期，否則容器會在還在寫資料時就被判定不健康。
      start_period: 60s

  # ============================================================================
  # market-feed — 報價產生器
  #
  # 它只做一件事：每 800ms 產生一批 tick，publish 到 Redis。
  # 不對外開 port，也沒有任何人會連它。
  #
  # ★ 這個服務可以被單獨關掉，用來演示降級：
  #
  #     docker compose stop market-feed
  #
  #   五秒內前端會顯示「報價來源目前沒有更新」，價格停在最後收到的值，
  #   而持倉、明細、下單通通照常。這是 README 的 P2 完成判準。
  # ============================================================================
  market-feed:
    build:
      context: .
      dockerfile: market-feed/Dockerfile

    container_name: digital-wealth-market-feed
    restart: unless-stopped

    environment:
      NODE_ENV: development
      TZ: Asia/Taipei

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      # 調快可以讓 demo 影片更有戲，調慢比較接近真實個股的成交頻率。
      FEED_TICK_INTERVAL_MS: ${FEED_TICK_INTERVAL_MS:-800}
      FEED_SYMBOLS_PER_TICK: ${FEED_SYMBOLS_PER_TICK:-12}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ★ 要等 api 健康才啟動 —— 不是因為它需要 api，
      #   而是因為 api 的 entrypoint 會跑 migration 與 seed。
      #   market-feed 開機時要讀 instruments 表，資料還沒寫進去就會
      #   讀到空的然後直接結束（「資料庫裡沒有任何可交易標的」）。
      api:
        condition: service_healthy

  # ============================================================================
  # web — 前端（nginx 提供靜態檔 ＋ 代理 API）
  #
  # 這是使用者實際打開的位址。它同時扮演兩個角色：
  #   1. 提供 Vite build 出來的靜態檔
  #   2. 把 /api 轉給 api 容器（含 WebSocket 升級）
  #
  # 為什麼要代理而不讓瀏覽器直接打 api：見 web/nginx.conf 的說明 ——
  # 一句話是「同源」，這樣 httpOnly cookie 與相對路徑才會正常運作。
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: web/Dockerfile

    container_name: digital-wealth-web
    restart: unless-stopped

    ports:
      # 主機端預設 8090。不用 80 是因為它通常需要 root 權限；
      # 不用 8080 是因為那是最容易撞到的 port（Tomcat、Spring Boot⋯）。
      - "${WEB_PORT:-8090}:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      # ★ 一定要寫 127.0.0.1，不能寫 localhost。
      #
      #   容器的 /etc/hosts 裡 localhost 同時對應 127.0.0.1 與 ::1，
      #   而解析時 **IPv6 優先**。nginx 的 `listen 80` 預設只綁 IPv4，
      #   所以 wget 連 ::1 會得到 connection refused。
      #
      #   症狀非常誤導：從主機 curl 網站回 200 一切正常，
      #   但容器被標成 unhealthy —— 看起來像健康檢查壞掉，
      #   其實是「檢查的位址跟服務監聽的位址不同」。
      #
      #   另一種解法是讓 nginx 也 `listen [::]:80`，但那是為了
      #   健康檢查去改服務的監聽行為，本末倒置。
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

# ==============================================================================
# Volumes（具名資料卷）
#
# 在這裡宣告後，上面的服務才能用 `- postgres_data:/path` 的形式掛載。
# 實際檔案由 Docker 管理，放在 /var/lib/docker/volumes/ 底下。
#
# 查看：docker volume ls
# 刪除：docker compose down -v（會連同容器一起刪掉資料）
# ==============================================================================
volumes:
  postgres_data:
  redis_data:

# ==============================================================================
# 關於「網路」
#
# 這個檔案沒有寫 networks 設定，因為 Compose 會自動建立一個預設網路，
# 把所有服務放進去。同一個網路裡的容器可以直接用「服務名」互相連線：
#
#   api 要連資料庫  → postgres:5432   （不是 localhost:5432）
#   api 要連 Redis  → redis:6379
#
# 這是 Docker 內建的 DNS 解析。之後寫 api 的連線字串時會用到這件事。
# ==============================================================================
