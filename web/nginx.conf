# ==============================================================================
# web/nginx.conf — 前端容器的 nginx 設定
#
# 這個檔案是什麼：
#   兩件事：提供靜態檔、把 /api 轉給後端容器。
#
# ── 為什麼前端容器要代理 API，不讓瀏覽器直接打 :3000 ★ ────────────
#
#   讓瀏覽器直接連後端也能動，但會付出三個代價：
#
#     1. **跨來源** —— 前端在 :8080、API 在 :3000 是不同來源。
#        要開 CORS，而 JWT 在 httpOnly cookie 裡，
#        還得處理 credentials、SameSite、preflight 一整套。
#
#     2. **cookie 的 path 保護會失效** —— cookie 設了 path=/api，
#        跨來源時瀏覽器對 cookie 的處理規則完全不同。
#
#     3. **前端要知道後端的位址** —— 就得有一個 build 時注入的
#        環境變數（VITE_API_URL）。靜態檔一旦 build 完就寫死了，
#        換個 port 部署就要重新 build。
#
#   走同源代理則全部消失：瀏覽器眼中只有一個來源，
#   前端程式碼裡的 API 位址永遠是相對路徑 `/api/v1/...`。
#
#   這也讓**開發環境與正式環境的行為一致** —— 開發時是 Vite 代理，
#   正式是 nginx 代理，前端程式碼一個字都不用改。
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 壓縮 ──────────────────────────────────────────────────────
    #
    # 前端 bundle 約 750KB，gzip 後約 220KB。對本機部署來說，
    # 這個差別在首次載入的體感上很明顯。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API 與 WebSocket 代理 ─────────────────────────────────────
    #
    # 一條規則同時處理兩者 —— 報價的端點是 /api/ws/quotes，
    # 它在 /api 底下（原因見 shared/schemas/quote.ts：
    # cookie 的 path 限制在 /api）。
    location /api {
        # `api` 是 docker-compose 的服務名。Docker 內建的 DNS 會把它
        # 解析成該容器的 IP —— 不能寫 localhost，那在容器裡指的是
        # nginx 容器自己。
        proxy_pass http://api:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 這三行是 WebSocket 能不能通的關鍵 ★ ──────────────────
        #
        #   WebSocket 的建立靠一個帶著 `Upgrade: websocket` 標頭的
        #   HTTP 請求。但 nginx **預設會把 hop-by-hop 標頭吃掉**
        #   （Upgrade 與 Connection 都屬於這一類），所以要手動轉發。
        #
        #   而且必須是 HTTP/1.1 —— HTTP/1.0 沒有連線升級這個機制。
        #
        #   少了它們的症狀：報價的 WebSocket 握手回 400 或直接被當成
        #   一般請求處理，前端無限重連。而 REST API 完全正常，
        #   所以很容易誤判成前端的問題。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 是長連線，預設 60 秒無資料就被 nginx 切斷。
        # 心跳是 20 秒一次，理論上不會觸發，但報價暫停時仍可能。
        # 設成 1 小時，讓斷線這件事由應用層的心跳決定，而不是代理。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA 的路由退回 ★ ──────────────────────────────────────────
    #
    #   使用者直接開 http://localhost:8080/transactions 時，
    #   nginx 會去找 /usr/share/nginx/html/transactions 這個檔案 ——
    #   它不存在，於是回 404。
    #
    #   但 /transactions 是 **React Router 的前端路由**，不是一個檔案。
    #   正確做法是把所有找不到的路徑都回傳 index.html，
    #   讓前端的 router 自己決定要顯示哪一頁。
    #
    #   少了這一行，網站在「首頁點進去」時完全正常，但只要
    #   **重新整理內頁或直接貼連結**就 404 —— 而本專案刻意讓
    #   下單結果頁可以分享連結，沒有這行那個設計就白做了。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 快取策略 ──────────────────────────────────────────────────
    #
    #   Vite build 產生的 JS/CSS 檔名帶有內容雜湊
    #   （index-CnpFCmcU.js）—— 內容變了檔名就變。
    #   所以這些檔案可以放心地永久快取。
    #
    #   index.html 則**絕對不能快取**：它是唯一指向那些帶雜湊檔名的
    #   入口。快取住的話，使用者重新整理仍會拿到舊的 index.html，
    #   於是載入舊版的 JS —— 部署了新版但沒有人看得到。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
